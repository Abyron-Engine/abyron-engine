<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abyron Engine</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#08090b;
color:#fff;
font-family:Arial,system-ui,sans-serif
}
.hidden{display:none!important}

.auth{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.card{
width:100%;
max-width:430px;
background:#111318;
border:1px solid #292e37;
border-radius:24px;
padding:28px;
box-shadow:0 20px 70px #0009
}

.logo{
width:60px;
height:60px;
margin:0 auto 15px;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
background:linear-gradient(135deg,#8b5cf6,#22d3ee)
}

h1{text-align:center;margin:0 0 7px}
.subtitle{text-align:center;color:#9299a5}

.tabs{
display:flex;
gap:4px;
background:#090b0e;
padding:4px;
border-radius:12px;
margin:24px 0
}

.tabs button{
flex:1;
padding:12px;
border:0;
border-radius:9px;
background:transparent;
color:#9299a5;
font-size:15px
}

.tabs button.active{
background:#22262e;
color:#fff
}

.field{margin-bottom:16px}

label{
display:block;
font-size:13px;
color:#b9bec8;
margin-bottom:7px
}

input,textarea{
width:100%;
padding:14px;
border-radius:11px;
border:1px solid #2c313a;
background:#0b0d10;
color:#fff;
outline:none
}

input:focus,textarea:focus{
border-color:#7c5cff
}

.primary{
width:100%;
padding:14px;
border:0;
border-radius:11px;
background:#fff;
color:#08090b;
font-weight:bold;
font-size:15px
}

.primary:disabled{
opacity:.5
}

.msg{
display:none;
margin-top:14px;
padding:12px;
border-radius:10px;
font-size:13px;
line-height:1.5
}

.msg.show{display:block}
.error{background:#35171b;color:#ffb8bf}
.success{background:#123021;color:#baf4d0}

.app{
max-width:950px;
margin:auto;
padding:18px
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 0;
border-bottom:1px solid #242932
}

.brand{
font-size:21px;
font-weight:bold
}

.logout{
background:#15181d;
border:1px solid #303640;
color:#fff;
padding:9px 14px;
border-radius:9px
}

.hero{
padding:30px 0 15px
}

.hero h2{
margin:0 0 7px;
font-size:30px
}

.muted{
color:#9299a5
}

.panel{
background:#111318;
border:1px solid #292e37;
border-radius:18px;
padding:18px;
margin-top:16px
}

.panel h3{
margin-top:0
}

.upload{
display:flex;
gap:10px;
flex-wrap:wrap
}

.upload input{
flex:1;
min-width:180px;
padding:10px
}

.small{
padding:10px 14px;
border:1px solid #303640;
background:#171a20;
color:#fff;
border-radius:9px
}

.file{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:12px 0;
border-bottom:1px solid #252a32
}

.chat{
min-height:150px;
max-height:400px;
overflow:auto;
margin-bottom:12px
}

.bubble{
padding:12px;
border-radius:12px;
margin:9px 0;
line-height:1.5;
white-space:pre-wrap
}

.user{
background:#20252d;
margin-left:15%
}

.ai{
background:#15191f;
margin-right:15%
}

.ask{
display:flex;
gap:9px
}

.ask textarea{
min-height:48px;
resize:none;
flex:1
}

.ask button{
width:110px
}

.note{
text-align:center;
font-size:12px;
color:#737b87;
margin-top:16px
}

.progress{
margin-top:12px;
font-size:13px;
color:#9ca3af
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<div id="authPage" class="auth">

<div class="card">

<div class="logo">A</div>

<h1>Abyron Engine</h1>

<div id="subtitle" class="subtitle">
Your private knowledge workspace
</div>

<div class="tabs">

<button id="loginTab" class="active" type="button">
Sign in
</button>

<button id="signupTab" type="button">
Create account
</button>

</div>

<form id="authForm">

<div class="field">
<label>Email</label>

<input
id="email"
type="email"
required
autocomplete="email"
placeholder="you@example.com">
</div>

<div class="field">
<label>Password</label>

<input
id="password"
type="password"
required
minlength="6"
autocomplete="current-password"
placeholder="Minimum 6 characters">
</div>

<button
id="authButton"
class="primary"
type="submit">
Sign in
</button>

<div id="authMessage" class="msg"></div>

</form>

<div class="note">
Secured by Supabase Authentication
</div>

</div>
</div>


<!-- ================= APP ================= -->

<div id="appPage" class="hidden">

<div class="app">

<div class="top">

<div class="brand">
⚡ Abyron Engine
</div>

<button id="logoutButton" class="logout">
Sign out
</button>

</div>


<div class="hero">

<h2>
Personal Knowledge Engine
</h2>

<div id="accountEmail" class="muted"></div>

</div>


<!-- ================= KNOWLEDGE ================= -->

<div class="panel">

<h3>
📚 Knowledge Library
</h3>

<div class="upload">

<input
id="fileInput"
type="file"
accept=".pdf,.txt,.md,.jpg,.jpeg,.png,.webp,application/pdf,text/plain,text/markdown,image/jpeg,image/png,image/webp">

<button
id="uploadButton"
class="small"
type="button">
Upload
</button>

</div>

<div
class="muted"
style="margin-top:10px;font-size:12px">

Supported:
PDF • JPG • JPEG • PNG • WEBP • TXT • MD

</div>

<div
id="uploadProgress"
class="progress">
</div>

<div
id="uploadMessage"
class="msg">
</div>

<div id="documents"></div>

</div>


<!-- ================= AI ================= -->

<div class="panel">

<h3>
🤖 Ask your knowledge
</h3>

<div id="chat" class="chat">

<div class="muted">
Upload your documents and ask questions about them.
</div>

</div>

<div class="ask">

<textarea
id="question"
placeholder="Ask something about your documents..."></textarea>

<button
id="askButton"
class="primary">
Ask AI
</button>

</div>

<div id="aiMessage" class="msg"></div>

</div>

</div>
</div>


<!-- ================= LIBRARIES ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- PDF.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

</script>

<!-- TESSERACT OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
"https://ohqrskefwvtlnngqmeqc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_aZiOzYpaik529lLoa_-C5Q_TKjs4iPk";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let authMode = "login";
let currentUser = null;


/* ================= HELPERS ================= */

function $(id){

return document.getElementById(id);

}


function showMessage(element,text,type){

element.textContent = text;

element.className =
"msg show " + type;

}


function hideMessage(element){

element.textContent = "";

element.className = "msg";

}


/* ================= AUTH MODE ================= */

function setAuthMode(mode){

authMode = mode;

$("loginTab").classList.toggle(
"active",
mode === "login"
);

$("signupTab").classList.toggle(
"active",
mode === "signup"
);

if(mode === "login"){

$("authButton").textContent =
"Sign in";

$("subtitle").textContent =
"Your private knowledge workspace";

$("password").autocomplete =
"current-password";

}else{

$("authButton").textContent =
"Create account";

$("subtitle").textContent =
"Create your private knowledge workspace";

$("password").autocomplete =
"new-password";

}

hideMessage($("authMessage"));

}


$("loginTab").onclick = function(){

setAuthMode("login");

};


$("signupTab").onclick = function(){

setAuthMode("signup");

};


/* ================= DASHBOARD ================= */

function showDashboard(user){

currentUser = user;

$("authPage").classList.add("hidden");

$("appPage").classList.remove("hidden");

$("accountEmail").textContent =
user.email || "";

loadDocuments();

}


/* ================= AUTH ================= */

$("authForm").addEventListener(
"submit",
async function(event){

event.preventDefault();

$("authButton").disabled = true;

hideMessage($("authMessage"));

try{

const email =
$("email").value.trim();

const password =
$("password").value;


if(authMode === "signup"){

const result =
await supabaseClient.auth.signUp({

email:email,

password:password

});

if(result.error)
throw result.error;

if(result.data.session){

showDashboard(
result.data.user
);

}else{

showMessage(
$("authMessage"),
"Account created. Check your email, confirm your account, then sign in.",
"success"
);

setAuthMode("login");

}

}else{

const result =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});

if(result.error)
throw result.error;

if(!result.data.session){

throw new Error(
"No login session was returned."
);

}

showDashboard(
result.data.user
);

}

}catch(error){

showMessage(
$("authMessage"),
error.message ||
"Authentication failed.",
"error"
);

}

$("authButton").disabled = false;

}
);


/* ================= LOGOUT ================= */

$("logoutButton").onclick =
async function(){

await supabaseClient.auth.signOut();

currentUser = null;

$("appPage").classList.add("hidden");

$("authPage").classList.remove("hidden");

$("email").value = "";

$("password").value = "";

setAuthMode("login");

};


/* ================= DOCUMENT LIST ================= */

async function loadDocuments(){

if(!currentUser)
return;

const result =
await supabaseClient
.from("documents")
.select("*")
.order(
"created_at",
{ascending:false}
);

if(result.error){

showMessage(
$("uploadMessage"),
result.error.message,
"error"
);

return;

}

const docs =
result.data || [];

if(!docs.length){

$("documents").innerHTML =
"<div class='muted' style='padding-top:14px'>No documents uploaded yet.</div>";

return;

}

$("documents").innerHTML =
docs.map(function(doc){

return `

<div class="file">

<span>
📄 ${escapeHTML(doc.name)}
</span>

<button
class="small"
onclick="deleteDocument('${doc.id}','${escapeJS(doc.file_path || "")}')">

Delete

</button>

</div>

`;

}).join("");

}


function escapeHTML(text){

return String(text).replace(
/[&<>"']/g,
function(c){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[c];

}
);

}


function escapeJS(text){

return String(text)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


/* ================= DELETE ================= */

window.deleteDocument =
async function(id,path){

if(!confirm(
"Delete this document?"
))
return;

const result =
await supabaseClient
.from("documents")
.delete()
.eq("id",id);

if(result.error){

alert(result.error.message);

return;

}

if(path){

await supabaseClient
.storage
.from("documents")
.remove([path]);

}

loadDocuments();

};


/* ================= TEXT CHUNKS ================= */

function createChunks(text){

const size = 1400;

const overlap = 250;

const chunks = [];

let position = 0;

while(position < text.length){

chunks.push(
text.substring(
position,
position + size
)
);

position += size - overlap;

}

return chunks;

}


/* ================= IMAGE OCR ================= */

async function imageToText(file){

$("uploadProgress").textContent =
"🔎 Reading image with OCR...";

const result =
await Tesseract.recognize(
file,
"eng+hin",
{

logger:function(info){

if(
info.status ===
"recognizing text"
){

const percent =
Math.round(
(info.progress || 0) * 100
);

$("uploadProgress").textContent =
"🔎 OCR: " +
percent +
"%";

}

}

}
);

return result.data.text || "";

}


/* ================= PDF TEXT ================= */

async function pdfToText(file){

$("uploadProgress").textContent =
"📖 Opening PDF...";

const buffer =
await file.arrayBuffer();

const pdf =
await pdfjsLib
.getDocument({
data:buffer
})
.promise;

let fullText = "";

for(
let pageNumber = 1;
pageNumber <= pdf.numPages;
pageNumber++
){

$("uploadProgress").textContent =
"📖 Reading PDF page " +
pageNumber +
" / " +
pdf.numPages;

const page =
await pdf.getPage(
pageNumber
);

const content =
await page.getTextContent();

const pageText =
content.items
.map(function(item){

return item.str || "";

})
.join(" ");

fullText +=
pageText +
"\n";

}

return fullText;

}


/* ================= UPLOAD ================= */

$("uploadButton").onclick =
async function(){

const file =
$("fileInput").files[0];

if(!file){

showMessage(
$("uploadMessage"),
"Please select a file first.",
"error"
);

return;

}

if(!currentUser){

showMessage(
$("uploadMessage"),
"Please sign in again.",
"error"
);

return;

}

$("uploadButton").disabled = true;

hideMessage(
$("uploadMessage")
);

$("uploadProgress").textContent =
"Preparing " +
file.name +
"...";


try{

let text = "";

const name =
file.name.toLowerCase();


/* TXT */

if(
name.endsWith(".txt") ||
name.endsWith(".md")
){

$("uploadProgress").textContent =
"📝 Reading text file...";

text =
await file.text();

}


/* IMAGE */

else if(
name.endsWith(".jpg") ||
name.endsWith(".jpeg") ||
name.endsWith(".png") ||
name.endsWith(".webp")
){

text =
await imageToText(file);

}


/* PDF */

else if(
name.endsWith(".pdf")
){

text =
await pdfToText(file);

}


/* UNKNOWN */

else{

throw new Error(
"Unsupported file type."
);

}


/* EMPTY */

if(!text.trim()){

throw new Error(
"No readable text found in this file."
);

}


/* STORAGE */

$("uploadProgress").textContent =
"☁️ Uploading file...";

const safeName =
file.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);

const filePath =
currentUser.id +
"/" +
Date.now() +
"-" +
safeName;


const storageResult =
await supabaseClient
.storage
.from("documents")
.upload(
filePath,
file,
{
upsert:false
}
);

if(storageResult.error)
throw storageResult.error;


/* DOCUMENT RECORD */

const documentResult =
await supabaseClient
.from("documents")
.insert({

user_id:currentUser.id,

name:file.name,

file_path:filePath,

file_type:file.type,

file_size:file.size

})
.select()
.single();

if(documentResult.error)
throw documentResult.error;


const document =
documentResult.data;


/* CHUNKS */

$("uploadProgress").textContent =
"🧠 Indexing knowledge...";

const chunks =
createChunks(text);


const rows =
chunks.map(
function(content,index){

return {

document_id:
document.id,

user_id:
currentUser.id,

content:
content,

chunk_index:
index

};

}
);


/* INSERT CHUNKS */

const chunkResult =
await supabaseClient
.from("document_chunks")
.insert(rows);

if(chunkResult.error)
throw chunkResult.error;


$("uploadProgress").textContent = "";

showMessage(
$("uploadMessage"),
"✅ " +
file.name +
" uploaded and indexed successfully.",
"success"
);

$("fileInput").value = "";

loadDocuments();

}catch(error){

$("uploadProgress").textContent = "";

showMessage(
$("uploadMessage"),
error.message ||
"Upload failed.",
"error"
);

}

$("uploadButton").disabled = false;

};


/* ================= CHAT ================= */

function addChatMessage(text,type){

const div =
document.createElement("div");

div.className =
"bubble " +
type;

div.textContent = text;

$("chat").appendChild(div);

$("chat").scrollTop =
$("chat").scrollHeight;

}


$("askButton").onclick =
async function(){

const question =
$("question").value.trim();

if(!question)
return;

if(!currentUser){

showMessage(
$("aiMessage"),
"Please sign in again.",
"error"
);

return;

}

$("askButton").disabled = true;

hideMessage(
$("aiMessage")
);

addChatMessage(
question,
"user"
);

$("question").value = "";

try{

const result =
await supabaseClient
.functions
.invoke(
"ai-chat",
{
body:{
question:question
}
}
);

if(result.error)
throw result.error;


const answer =
result.data &&
(
result.data.answer ||
result.data.message
);


if(!answer){

throw new Error(
"No answer was returned by AI."
);

}


addChatMessage(
answer,
"ai"
);

}catch(error){

showMessage(
$("aiMessage"),
error.message ||
"AI request failed.",
"error"
);

}

$("askButton").disabled = false;

};


/* ================= RESTORE SESSION ================= */

(async function(){

const result =
await supabaseClient
.auth
.getSession();

if(
result.data &&
result.data.session
){

showDashboard(
result.data.session.user
);

}

})();


/* ================= AUTH STATE ================= */

supabaseClient
.auth
.onAuthStateChange(
function(event,session){

if(
session &&
event === "SIGNED_IN"
){

showDashboard(
session.user
);

}

});

</script>

</body>
</html>
