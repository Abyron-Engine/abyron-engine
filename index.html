<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abyron Engine</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#08090b;
color:#fff;
font-family:Arial,system-ui,sans-serif;
min-height:100vh
}
.hidden{display:none!important}

.auth{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}
.card{
width:100%;
max-width:430px;
background:#111318;
border:1px solid #292e37;
border-radius:24px;
padding:28px;
box-shadow:0 20px 70px #0009
}
.logo{
width:60px;
height:60px;
margin:0 auto 15px;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
background:linear-gradient(135deg,#8b5cf6,#22d3ee)
}
h1{text-align:center;margin:0 0 7px}
.subtitle{text-align:center;color:#9299a5}

.tabs{
display:flex;
gap:4px;
background:#090b0e;
padding:4px;
border-radius:12px;
margin:24px 0
}
.tabs button{
flex:1;
padding:12px;
border:0;
border-radius:9px;
background:transparent;
color:#9299a5;
font-size:15px
}
.tabs button.active{
background:#22262e;
color:#fff
}

label{
display:block;
font-size:13px;
color:#b9bec8;
margin-bottom:7px
}
input,textarea{
width:100%;
padding:14px;
border-radius:11px;
border:1px solid #2c313a;
background:#0b0d10;
color:#fff;
outline:none
}
.field{margin-bottom:16px}

.primary{
width:100%;
padding:14px;
border:0;
border-radius:11px;
background:#fff;
color:#08090b;
font-weight:bold;
font-size:15px
}
.primary:disabled{opacity:.5}

.msg{
display:none;
margin-top:14px;
padding:12px;
border-radius:10px;
font-size:13px;
line-height:1.5
}
.msg.show{display:block}
.error{background:#35171b;color:#ffb8bf}
.success{background:#123021;color:#baf4d0}

.app{
max-width:950px;
margin:auto;
padding:18px
}
.top{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 0;
border-bottom:1px solid #242932
}
.brand{
font-size:21px;
font-weight:bold
}
.logout{
background:#15181d;
border:1px solid #303640;
color:#fff;
padding:9px 14px;
border-radius:9px
}

.hero{padding:30px 0 15px}
.hero h2{margin:0 0 7px;font-size:30px}
.muted{color:#9299a5}

.panel{
background:#111318;
border:1px solid #292e37;
border-radius:18px;
padding:18px;
margin-top:16px
}
.panel h3{margin-top:0}

.upload{
display:flex;
gap:10px;
flex-wrap:wrap
}
.upload input{
flex:1;
min-width:180px;
padding:10px
}
.small{
padding:10px 14px;
border:1px solid #303640;
background:#171a20;
color:#fff;
border-radius:9px
}

.file{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:12px 0;
border-bottom:1px solid #252a32
}

.chat{
min-height:150px;
max-height:400px;
overflow:auto;
margin-bottom:12px
}
.bubble{
padding:12px;
border-radius:12px;
margin:9px 0;
line-height:1.5;
white-space:pre-wrap
}
.user{
background:#20252d;
margin-left:15%
}
.ai{
background:#15191f;
margin-right:15%
}

.ask{
display:flex;
gap:9px
}
.ask textarea{
min-height:48px;
resize:none;
flex:1
}
.ask button{width:110px}

.note{
text-align:center;
font-size:12px;
color:#737b87;
margin-top:16px
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="authPage" class="auth">

<div class="card">

<div class="logo">A</div>

<h1>Abyron Engine</h1>

<div id="subtitle" class="subtitle">
Your private knowledge workspace
</div>

<div class="tabs">

<button id="loginTab" class="active" type="button">
Sign in
</button>

<button id="signupTab" type="button">
Create account
</button>

</div>

<form id="authForm">

<div class="field">
<label>Email</label>
<input
id="email"
type="email"
required
autocomplete="email"
placeholder="you@example.com">
</div>

<div class="field">
<label>Password</label>
<input
id="password"
type="password"
required
minlength="6"
autocomplete="current-password"
placeholder="Minimum 6 characters">
</div>

<button id="authButton" class="primary" type="submit">
Sign in
</button>

<div id="authMessage" class="msg"></div>

</form>

<div class="note">
Secured by Supabase Authentication
</div>

</div>
</div>


<!-- ================= DASHBOARD ================= -->

<div id="appPage" class="hidden">

<div class="app">

<div class="top">

<div class="brand">
⚡ Abyron Engine
</div>

<button id="logoutButton" class="logout">
Sign out
</button>

</div>

<div class="hero">

<h2>
Personal Knowledge Engine
</h2>

<div id="accountEmail" class="muted"></div>

</div>


<!-- KNOWLEDGE -->

<div class="panel">

<h3>📚 Knowledge</h3>

<div class="upload">

<input
id="fileInput"
type="file"
accept=".txt,.md,.pdf">

<button id="uploadButton" class="small">
Upload
</button>

</div>

<div id="uploadMessage" class="msg"></div>

<div id="documents"></div>

</div>


<!-- AI -->

<div class="panel">

<h3>🤖 Ask your knowledge</h3>

<div id="chat" class="chat">

<div class="muted">
Upload your notes or documents and then ask questions.
</div>

</div>

<div class="ask">

<textarea
id="question"
placeholder="Ask something about your documents..."></textarea>

<button id="askButton" class="primary">
Ask AI
</button>

</div>

<div id="aiMessage" class="msg"></div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ohqrskefwvtlnngqmeqc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_aZiOzYpaik529lLoa_-C5Q_TKjs4iPk";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let authMode = "login";
let currentUser = null;


/* ================= HELPERS ================= */

function $(id){
return document.getElementById(id);
}

function showMessage(element,text,type){

element.textContent = text;
element.className = "msg show " + type;

}

function hideMessage(element){

element.textContent = "";
element.className = "msg";

}


/* ================= AUTH MODE ================= */

function setAuthMode(mode){

authMode = mode;

$("loginTab").classList.toggle(
"active",
mode === "login"
);

$("signupTab").classList.toggle(
"active",
mode === "signup"
);

if(mode === "login"){

$("authButton").textContent = "Sign in";

$("subtitle").textContent =
"Your private knowledge workspace";

$("password").autocomplete =
"current-password";

}else{

$("authButton").textContent =
"Create account";

$("subtitle").textContent =
"Create your private knowledge workspace";

$("password").autocomplete =
"new-password";

}

hideMessage($("authMessage"));

}


$("loginTab").onclick = function(){

setAuthMode("login");

};


$("signupTab").onclick = function(){

setAuthMode("signup");

};


/* ================= SHOW DASHBOARD ================= */

function showDashboard(user){

currentUser = user;

$("authPage").classList.add("hidden");

$("appPage").classList.remove("hidden");

$("accountEmail").textContent =
user.email || "";

loadDocuments();

}


/* ================= AUTH FORM ================= */

$("authForm").addEventListener(
"submit",
async function(event){

event.preventDefault();

$("authButton").disabled = true;

hideMessage($("authMessage"));

try{

const email =
$("email").value.trim();

const password =
$("password").value;


if(authMode === "signup"){

const result =
await supabaseClient.auth.signUp({

email: email,

password: password

});


if(result.error)
throw result.error;


if(result.data.session){

showDashboard(
result.data.user
);

}else{

showMessage(
$("authMessage"),
"Account created successfully. Please check your email, confirm your account, then sign in.",
"success"
);

setAuthMode("login");

}

}else{

const result =
await supabaseClient.auth.signInWithPassword({

email: email,

password: password

});


if(result.error)
throw result.error;


if(result.data.session){

showDashboard(
result.data.user
);

}else{

throw new Error(
"Login succeeded but no session was returned."
);

}

}

}catch(error){

showMessage(
$("authMessage"),
error.message || "Authentication failed.",
"error"
);

}

$("authButton").disabled = false;

}
);


/* ================= LOGOUT ================= */

$("logoutButton").onclick =
async function(){

await supabaseClient.auth.signOut();

currentUser = null;

$("appPage").classList.add("hidden");

$("authPage").classList.remove("hidden");

$("email").value = "";

$("password").value = "";

setAuthMode("login");

};


/* ================= DOCUMENTS ================= */

async function loadDocuments(){

if(!currentUser)
return;

const result =
await supabaseClient
.from("documents")
.select("*")
.order(
"created_at",
{ascending:false}
);

if(result.error){

showMessage(
$("uploadMessage"),
result.error.message,
"error"
);

return;

}

const docs = result.data || [];

if(docs.length === 0){

$("documents").innerHTML =
"<div class='muted' style='padding-top:14px'>No documents uploaded yet.</div>";

return;

}

$("documents").innerHTML =
docs.map(function(doc){

return `
<div class="file">

<span>📄 ${escapeHTML(doc.name)}</span>

<button
class="small"
onclick="deleteDocument('${doc.id}','${escapeJS(doc.file_path || "")}')">
Delete
</button>

</div>
`;

}).join("");

}


function escapeHTML(text){

return String(text).replace(
/[&<>"']/g,
function(char){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[char];

}
);

}


function escapeJS(text){

return String(text)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


/* ================= DELETE ================= */

window.deleteDocument =
async function(id,path){

if(!confirm("Delete this document?"))
return;

const result =
await supabaseClient
.from("documents")
.delete()
.eq("id",id);

if(result.error){

alert(result.error.message);

return;

}

if(path){

await supabaseClient
.storage
.from("documents")
.remove([path]);

}

loadDocuments();

};


/* ================= TEXT CHUNKING ================= */

function createChunks(text){

const chunks = [];

const size = 1400;

const overlap = 250;

let position = 0;

while(position < text.length){

chunks.push(
text.substring(
position,
position + size
)
);

position += size - overlap;

}

return chunks;

}


/* ================= UPLOAD ================= */

$("uploadButton").onclick =
async function(){

const file =
$("fileInput").files[0];

if(!file){

showMessage(
$("uploadMessage"),
"Please select a PDF, TXT or MD file first.",
"error"
);

return;

}

if(!currentUser){

showMessage(
$("uploadMessage"),
"Please sign in again.",
"error"
);

return;

}

$("uploadButton").disabled = true;

hideMessage($("uploadMessage"));

try{

let text = "";


/* TXT / MD */

if(
file.name.toLowerCase().endsWith(".txt") ||
file.name.toLowerCase().endsWith(".md")
){

text = await file.text();

}


/* PDF */

else if(
file.name.toLowerCase().endsWith(".pdf")
){

showMessage(
$("uploadMessage"),
"PDF detected. PDF text extraction will be added next.",
"error"
);

$("uploadButton").disabled = false;

return;

}

else{

throw new Error(
"Only PDF, TXT and MD files are supported."
);

}


if(!text.trim()){

throw new Error(
"No readable text found in this file."
);

}


/* STORAGE PATH */

const safeName =
file.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);

const filePath =
currentUser.id +
"/" +
Date.now() +
"-" +
safeName;


/* STORAGE UPLOAD */

const upload =
await supabaseClient
.storage
.from("documents")
.upload(
filePath,
file,
{upsert:false}
);

if(upload.error)
throw upload.error;


/* DOCUMENT RECORD */

const documentInsert =
await supabaseClient
.from("documents")
.insert({

user_id:currentUser.id,

name:file.name,

file_path:filePath,

file_type:file.type,

file_size:file.size

})
.select()
.single();

if(documentInsert.error)
throw documentInsert.error;


const document =
documentInsert.data;


/* CHUNKS */

const chunks =
createChunks(text);

const rows =
chunks.map(
function(content,index){

return {

document_id:document.id,

user_id:currentUser.id,

content:content,

chunk_index:index

};

}
);


/* INSERT CHUNKS */

const chunkInsert =
await supabaseClient
.from("document_chunks")
.insert(rows);

if(chunkInsert.error)
throw chunkInsert.error;


showMessage(
$("uploadMessage"),
"Document uploaded and indexed successfully.",
"success"
);

$("fileInput").value = "";

loadDocuments();

}catch(error){

showMessage(
$("uploadMessage"),
error.message || "Upload failed.",
"error"
);

}

$("uploadButton").disabled = false;

};


/* ================= AI CHAT ================= */

function addChatMessage(text,type){

const div =
document.createElement("div");

div.className =
"bubble " + type;

div.textContent = text;

$("chat").appendChild(div);

$("chat").scrollTop =
$("chat").scrollHeight;

}


$("askButton").onclick =
async function(){

const question =
$("question").value.trim();

if(!question)
return;

if(!currentUser){

showMessage(
$("aiMessage"),
"Please sign in again.",
"error"
);

return;

}

$("askButton").disabled = true;

hideMessage($("aiMessage"));

addChatMessage(
question,
"user"
);

$("question").value = "";

try{

const result =
await supabaseClient
.functions
.invoke(
"ai-chat",
{
body:{
question:question
}
}
);

if(result.error)
throw result.error;

const answer =
result.data &&
(
result.data.answer ||
result.data.message
);

if(!answer){

throw new Error(
"No answer was returned by AI."
);

}

addChatMessage(
answer,
"ai"
);

}catch(error){

showMessage(
$("aiMessage"),
error.message || "AI request failed.",
"error"
);

}

$("askButton").disabled = false;

};


/* ================= SESSION CHECK ================= */

(async function(){

const result =
await supabaseClient.auth.getSession();

if(
result.data &&
result.data.session
){

showDashboard(
result.data.session.user
);

}

})();


/* ================= AUTH STATE ================= */

supabaseClient.auth.onAuthStateChange(
function(event,session){

if(
session &&
event === "SIGNED_IN"
){

showDashboard(
session.user
);

}

});

</script>

</body>
</html>
